<!DOCTYPE html>
<html lang="en">

<head>
    <title>Punt 17 - Kappel onder K61</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="mission-box">
        <h1>Punt 17 - Kappel onder K61</h1>
        <h2>Je bent op een bonus punt! Proficiat!</h2>
        <p>Je krijgt hierdoor <b>BLACK MARKET TOKEN</b>.</p>
        <p><img src="media/blackmarket.png"></p>
        <p>Met deze kaart mag de patrouille aan de wapenpost een speciaal exclusief item kopen: Mega katapult, Super
            shield of 100 ammo.</p>
        <p>Klik aan welke patrouille jullie zijn en welk punt</p>
        <form action="https://formspree.io/f/mgonoqlz" method="POST">
            <fieldset>
                <label>
                    Patrouille:
                    <select id="Patrouille" name="Patrouille">
                        <option value="Patrouille"></option>
                        <option value="Piranha's">Piranha's</option>
                        <option value="Condors">Condors</option>
                        <option value="Stieren">Stieren</option>
                        <option value="Pythons">Pythons</option>
                    </select>
                </label>
                <label>
                    Punt:
                    <input type="text" name="Punt">
                </label><br>
                <button type="submit">Verstuur</button>
            </fieldset>
        </form>
    </div>
</body>
